<text x="404.4" y="806" font-size="12.5" font-weight="400" fill="#4A6485" text-anchor="start" dominant-baseline="central">Prisma 7 ORM, migrasyonlar</text>
<rect x="720.8" y="742" width="318.4" height="92" rx="12" fill="#E6F1FC" stroke="#C9DDF2" stroke-width="1.5"/>
<text x="738.8" y="776" font-size="16" font-weight="700" fill="#1F4E8C" dominant-baseline="central">Dosya deposu</text>
<text x="738.8" y="806" font-size="12.5" font-weight="400" fill="#4A6485" text-anchor="start" dominant-baseline="central">yüklenen belgeler, sürümler</text>
<rect x="1055.1999999999998" y="742" width="318.4" height="92" rx="12" fill="#E6F1FC" stroke="#C9DDF2" stroke-width="1.5"/>
<text x="1073.1999999999998" y="776" font-size="16" font-weight="700" fill="#1F4E8C" dominant-baseline="central">Denetim kaydı</text>
<text x="1073.1999999999998" y="806" font-size="12.5" font-weight="400" fill="#4A6485" text-anchor="start" dominant-baseline="central">her değişiklik kaydedilir</text>
