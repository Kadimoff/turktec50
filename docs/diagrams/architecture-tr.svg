<rect width="1760" height="930" fill="#FFFFFF"/>
<text x="32" y="38" font-size="26" font-weight="800" fill="#1F4E8C" dominant-baseline="central">TÜRKTECH 50 — platform mimarisi</text>
<text x="32" y="68" font-size="14" font-weight="400" fill="#4A6485" dominant-baseline="central">Paydaşlar → rol tabanlı platform ve modüller → sonuç; altta teknik katman</text>
<text x="32" y="112" font-size="16" font-weight="800" fill="#1F4E8C" dominant-baseline="central">Paydaşlar</text>
<rect x="32" y="136" width="330" height="84" rx="12" fill="#E6F1FC" stroke="#C9DDF2" stroke-width="1.5"/>
<text x="52" y="168" font-size="16" font-weight="700" fill="#1F4E8C" dominant-baseline="central">Üniversiteler ve ekipler</text>
<text x="52" y="193" font-size="12.5" font-weight="400" fill="#4A6485" dominant-baseline="central">ADNSU, ASOİU ve ortak üniversiteler</text>
<rect x="32" y="238" width="330" height="84" rx="12" fill="#E6F1FC" stroke="#C9DDF2" stroke-width="1.5"/>
<text x="52" y="270" font-size="16" font-weight="700" fill="#1F4E8C" dominant-baseline="central">Mentorlar</text>
<text x="52" y="295" font-size="12.5" font-weight="400" fill="#4A6485" dominant-baseline="central">teknik, iş, fikri mülkiyet</text>
<rect x="32" y="340" width="330" height="84" rx="12" fill="#E6F1FC" stroke="#C9DDF2" stroke-width="1.5"/>
<text x="52" y="372" font-size="16" font-weight="700" fill="#1F4E8C" dominant-baseline="central">Jüri</text>
<text x="52" y="397" font-size="12.5" font-weight="400" fill="#4A6485" dominant-baseline="central">seçim, ara jüri, deneme finali</text>
<rect x="32" y="442" width="330" height="84" rx="12" fill="#E6F1FC" stroke="#C9DDF2" stroke-width="1.5"/>
<text x="52" y="474" font-size="16" font-weight="700" fill="#1F4E8C" dominant-baseline="central">Koordinatörler</text>
<text x="52" y="499" font-size="12.5" font-weight="400" fill="#4A6485" dominant-baseline="central">Startup ve Teknoloji Transferi Şubesi</text>
<rect x="32" y="544" width="330" height="84" rx="12" fill="#FFFFFF" stroke="#C9DDF2" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="52" y="576" font-size="16" font-weight="700" fill="#1F4E8C" dominant-baseline="central">Ortaklar ve yatırımcılar</text>
<text x="52" y="601" font-size="12.5" font-weight="400" fill="#4A6485" dominant-baseline="central">KPI raporu ve sunum materyali</text>
<text x="440" y="112" font-size="16" font-weight="800" fill="#1F4E8C" dominant-baseline="central">Platform ve modüller</text>
