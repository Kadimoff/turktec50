<text x="464" y="166" font-size="20" font-weight="800" fill="#1F4E8C" dominant-baseline="central">TÜRKTECH 50 platformu</text>
<text x="464" y="191" font-size="13" font-weight="400" fill="#4A6485" dominant-baseline="central">rol tabanlı proje takibi · süreç haritası · KPI</text>
<rect x="464" y="214" width="266.6666666666667" height="86" rx="12" fill="#E6F1FC" stroke="#C9DDF2" stroke-width="1.5"/>
<text x="482" y="246" font-size="16" font-weight="700" fill="#1F4E8C" dominant-baseline="central">Başvurular</text>
<text x="482" y="272" font-size="12.5" font-weight="400" fill="#4A6485" dominant-baseline="central">seçim rubriği, insan kararı</text>
<rect x="746.6666666666667" y="214" width="266.6666666666667" height="86" rx="12" fill="#E6F1FC" stroke="#C9DDF2" stroke-width="1.5"/>
<text x="764.6666666666667" y="246" font-size="16" font-weight="700" fill="#1F4E8C" dominant-baseline="central">Projeler</text>
<text x="764.6666666666667" y="272" font-size="12.5" font-weight="400" fill="#4A6485" dominant-baseline="central">aşamalar, aşama göstergesi, atamalar</text>
<rect x="1029.3333333333335" y="214" width="266.6666666666667" height="86" rx="12" fill="#E6F1FC" stroke="#C9DDF2" stroke-width="1.5"/>
<text x="1047.3333333333335" y="246" font-size="16" font-weight="700" fill="#1F4E8C" dominant-baseline="central">Görevler</text>
<text x="1047.3333333333335" y="272" font-size="12.5" font-weight="400" fill="#4A6485" dominant-baseline="central">Kanban, sorumlu, kabul ölçütü</text>
<rect x="464" y="314" width="266.6666666666667" height="86" rx="12" fill="#E6F1FC" stroke="#C9DDF2" stroke-width="1.5"/>
<text x="482" y="346" font-size="16" font-weight="700" fill="#1F4E8C" dominant-baseline="central">Mentorlar</text>
<text x="482" y="372" font-size="12.5" font-weight="400" fill="#4A6485" dominant-baseline="central">oturumlar, notlar, sonraki adım</text>
<rect x="746.6666666666667" y="314" width="266.6666666666667" height="86" rx="12" fill="#E6F1FC" stroke="#C9DDF2" stroke-width="1.5"/>
<text x="764.6666666666667" y="346" font-size="16" font-weight="700" fill="#1F4E8C" dominant-baseline="central">Belgeler</text>
<text x="764.6666666666667" y="372" font-size="12.5" font-weight="400" fill="#4A6485" dominant-baseline="central">kontrol listesi, sürüm, gizlilik</text>
<rect x="1029.3333333333335" y="314" width="266.6666666666667" height="86" rx="12" fill="#E6F1FC" stroke="#C9DDF2" stroke-width="1.5"/>
<text x="1047.3333333333335" y="346" font-size="16" font-weight="700" fill="#1F4E8C" dominant-baseline="central">Riskler</text>
<text x="1047.3333333333335" y="372" font-size="12.5" font-weight="400" fill="#4A6485" dominant-baseline="central">3×3 matris, azaltma</text>
<rect x="464" y="414" width="266.6666666666667" height="86" rx="12" fill="#E6F1FC" stroke="#C9DDF2" stroke-width="1.5"/>
<text x="482" y="446" font-size="16" font-weight="700" fill="#1F4E8C" dominant-baseline="central">Jüri</text>
<text x="482" y="472" font-size="12.5" font-weight="400" fill="#4A6485" dominant-baseline="central">ara jüri, deneme finali</text>
<rect x="746.6666666666667" y="414" width="266.6666666666667" height="86" rx="12" fill="#E6F1FC" stroke="#C9DDF2" stroke-width="1.5"/>
<text x="764.6666666666667" y="446" font-size="16" font-weight="700" fill="#1F4E8C" dominant-baseline="central">KPI</text>
<text x="764.6666666666667" y="472" font-size="12.5" font-weight="400" fill="#4A6485" dominant-baseline="central">huni 150 → 10, CSV</text>
<rect x="1029.3333333333335" y="414" width="266.6666666666667" height="86" rx="12" fill="#E6F1FC" stroke="#C9DDF2" stroke-width="1.5"/>
<text x="1047.3333333333335" y="446" font-size="16" font-weight="700" fill="#1F4E8C" dominant-baseline="central">Yönetim ve denetim</text>
<text x="1047.3333333333335" y="472" font-size="12.5" font-weight="400" fill="#4A6485" dominant-baseline="central">kullanıcılar, kayıt, aşamalar</text>
<rect x="464" y="514" width="832" height="46" rx="12" fill="#D4E6FA" stroke="#C9DDF2" stroke-width="1.5"/>
<text x="880" y="537" font-size="14" font-weight="700" fill="#1F4E8C" text-anchor="middle" dominant-baseline="central">Süreç haritası · yapılandırılabilir aşamalar · otomatik + elle geçişler</text>
<text x="1400" y="112" font-size="16" font-weight="800" fill="#1F4E8C" dominant-baseline="central">Sonuç</text>
<rect x="1400" y="176" width="328" height="104" rx="12" fill="#E6F1FC" stroke="#C9DDF2" stroke-width="1.5"/>
<text x="1420" y="216" font-size="17" font-weight="700" fill="#1F4E8C" dominant-baseline="central">Yarışma başvurusu</text>
<text x="1420" y="238.5" font-size="12.5" font-weight="400" fill="#4A6485" text-anchor="start" dominant-baseline="central">kalite kontrolden geçen paket (TEKNOFEST</text><text x="1420" y="253.5" font-size="12.5" font-weight="400" fill="#4A6485" text-anchor="start" dominant-baseline="central">vb.)</text>
<rect x="1400" y="320" width="328" height="104" rx="12" fill="#E6F5EC" stroke="#B3DCC3" stroke-width="1.5"/>
<text x="1420" y="360" font-size="17" font-weight="700" fill="#1F7A52" dominant-baseline="central">Finalistler</text>
<text x="1420" y="390" font-size="12.5" font-weight="400" fill="#4A6485" text-anchor="start" dominant-baseline="central">pilot hedef: 10 ekip</text>
<rect x="1400" y="464" width="328" height="104" rx="12" fill="#E6F1FC" stroke="#C9DDF2" stroke-width="1.5"/>
<text x="1420" y="504" font-size="17" font-weight="700" fill="#1F4E8C" dominant-baseline="central">Raporlama ve izlenebilirlik</text>
<text x="1420" y="534" font-size="12.5" font-weight="400" fill="#4A6485" text-anchor="start" dominant-baseline="central">KPI, denetim izi, sunum</text>
