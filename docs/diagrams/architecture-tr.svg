<text x="32" y="900" font-size="13" font-weight="400" fill="#4A6485" font-style="italic" dominant-baseline="central">Ortaklar ve yatırımcılar platformda ayrı bir rol değildir: onlara KPI raporu, süreç haritası (sunum modu, SVG/PNG) ve finalistler sunulur.</text>
