<text x="1407.6" y="776" font-size="16" font-weight="700" fill="#1F4E8C" dominant-baseline="central">Güvenlik</text>
<text x="1407.6" y="806" font-size="12.5" font-weight="400" fill="#4A6485" text-anchor="start" dominant-baseline="central">JWT oturum, RBAC, root hesabı</text>
