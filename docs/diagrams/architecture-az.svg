<text x="52" y="168" font-size="16" font-weight="700" fill="#1F4E8C" dominant-baseline="central">Universitetlər və komandalar</text>
<text x="52" y="193" font-size="12.5" font-weight="400" fill="#4A6485" dominant-baseline="central">ADNSU, ASOİU və tərəfdaş universitetlər</text>
<rect x="32" y="238" width="330" height="84" rx="12" fill="#E6F1FC" stroke="#C9DDF2" stroke-width="1.5"/>
<text x="52" y="270" font-size="16" font-weight="700" fill="#1F4E8C" dominant-baseline="central">Mentorlar</text>
<text x="52" y="295" font-size="12.5" font-weight="400" fill="#4A6485" dominant-baseline="central">texniki, biznes, əqli mülkiyyət</text>
<rect x="32" y="340" width="330" height="84" rx="12" fill="#E6F1FC" stroke="#C9DDF2" stroke-width="1.5"/>
<text x="52" y="372" font-size="16" font-weight="700" fill="#1F4E8C" dominant-baseline="central">Münsiflər</text>
<text x="52" y="397" font-size="12.5" font-weight="400" fill="#4A6485" dominant-baseline="central">seçim, ara münsif, sınaq finalı</text>
<rect x="32" y="442" width="330" height="84" rx="12" fill="#E6F1FC" stroke="#C9DDF2" stroke-width="1.5"/>
<text x="52" y="474" font-size="16" font-weight="700" fill="#1F4E8C" dominant-baseline="central">Koordinatorlar</text>
<text x="52" y="499" font-size="12.5" font-weight="400" fill="#4A6485" dominant-baseline="central">Startap və Texnologiya Transferi Şöbəsi</text>
