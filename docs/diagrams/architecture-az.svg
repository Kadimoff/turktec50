<text x="464" y="166" font-size="20" font-weight="800" fill="#1F4E8C" dominant-baseline="central">TÜRKTECH 50 platforması</text>
<text x="464" y="191" font-size="13" font-weight="400" fill="#4A6485" dominant-baseline="central">rol əsaslı layihə izləmə · proses xəritəsi · KPI</text>
