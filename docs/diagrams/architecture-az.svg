<rect width="1760" height="930" fill="#FFFFFF"/>
<text x="32" y="38" font-size="26" font-weight="800" fill="#1F4E8C" dominant-baseline="central">TÜRKTECH 50 — platformanın arxitekturası</text>
<text x="32" y="68" font-size="14" font-weight="400" fill="#4A6485" dominant-baseline="central">İştirakçılar → rol əsaslı platforma və modullar → nəticə; altda texniki qat</text>
<text x="32" y="112" font-size="16" font-weight="800" fill="#1F4E8C" dominant-baseline="central">İştirakçılar</text>
