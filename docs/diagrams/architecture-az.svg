<text x="482" y="372" font-size="12.5" font-weight="400" fill="#4A6485" dominant-baseline="central">sessiyalar, qeydlər, növbəti addım</text>
<rect x="746.6666666666667" y="314" width="266.6666666666667" height="86" rx="12" fill="#E6F1FC" stroke="#C9DDF2" stroke-width="1.5"/>
<text x="764.6666666666667" y="346" font-size="16" font-weight="700" fill="#1F4E8C" dominant-baseline="central">Sənədlər</text>
<text x="764.6666666666667" y="372" font-size="12.5" font-weight="400" fill="#4A6485" dominant-baseline="central">checklist, versiya, gizlilik</text>
