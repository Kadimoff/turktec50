<text x="482" y="246" font-size="16" font-weight="700" fill="#1F4E8C" dominant-baseline="central">Müraciətlər</text>
<text x="482" y="272" font-size="12.5" font-weight="400" fill="#4A6485" dominant-baseline="central">seçim rubriki, insan qərarı</text>
