<text x="1047.3333333333335" y="446" font-size="16" font-weight="700" fill="#1F4E8C" dominant-baseline="central">İdarəetmə və audit</text>
<text x="1047.3333333333335" y="472" font-size="12.5" font-weight="400" fill="#4A6485" dominant-baseline="central">istifadəçilər, jurnal, mərhələlər</text>
<rect x="464" y="514" width="832" height="46" rx="12" fill="#D4E6FA" stroke="#C9DDF2" stroke-width="1.5"/>
<text x="880" y="537" font-size="14" font-weight="700" fill="#1F4E8C" text-anchor="middle" dominant-baseline="central">Proses xəritəsi · konfiqurasiya edilə bilən mərhələlər · avtomatik + əl ilə keçidlər</text>
<text x="1400" y="112" font-size="16" font-weight="800" fill="#1F4E8C" dominant-baseline="central">Nəticə</text>
