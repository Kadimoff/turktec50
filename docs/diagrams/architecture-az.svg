<text x="1047.3333333333335" y="346" font-size="16" font-weight="700" fill="#1F4E8C" dominant-baseline="central">Risklər</text>
<text x="1047.3333333333335" y="372" font-size="12.5" font-weight="400" fill="#4A6485" dominant-baseline="central">3×3 matris, yumşaltma</text>
<rect x="464" y="414" width="266.6666666666667" height="86" rx="12" fill="#E6F1FC" stroke="#C9DDF2" stroke-width="1.5"/>
